name: Cross-build amd64 pkgbase

on:
  push:
    branches: [ '15.1-build']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target_arch }} ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target_arch: [ amd64 ]
        os: [ ubuntu-24.04 ]
        include:
          # TODO: both Ubuntu and macOS have bmake packages, we should try them instead of bootstrapping our own copy.
          # clang-18 mis-compiles the amd64 kernel/modules: it emits the
          # stack-protector __stack_chk_guard load via the GOT
          # (R_X86_64_REX_GOTPCRELX), which the in-kernel module linker
          # cannot resolve -> unloadable modules (e.g. zfs.ko). clang-19
          # (what FreeBSD 15 ships natively) does not.  No CFLAGS workaround
          # fixes clang-18; the fix is to build with clang-19.
          - os: ubuntu-24.04
            compiler: clang-19
            cross-bindir: /usr/lib/llvm-19/bin
            pkgs: bmake libarchive-dev clang-19 lld-19
          - target_arch: amd64
            target: amd64
    steps:
      - uses: actions/checkout@v4
      - name: install packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --quiet || true
          sudo apt-get -yq --no-install-suggests --no-install-recommends install ${{ matrix.pkgs }}
      - name: create environment
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          if [ -n "${{ matrix.cross-bindir }}" ]; then
            echo "EXTRA_BUILD_ARGS=--cross-bindir=${{ matrix.cross-bindir }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ matrix.cross-toolchain }}" ]; then
            echo "EXTRA_BUILD_ARGS=--cross-toolchain=${{ matrix.cross-toolchain }}" >> $GITHUB_ENV
          fi
          mkdir -p ../build
          echo "MAKEOBJDIRPREFIX=${PWD%/*}/build" >> $GITHUB_ENV
          # heh, works on Linux/BSD/macOS ...
          echo "NPROC=`getconf _NPROCESSORS_ONLN 2>/dev/null || getconf NPROCESSORS_ONLN 2>/dev/null || echo 1`" >> $GITHUB_ENV
          # Skip the 32-bit world and debug files: no lib32 / -dbg packages,
          # which also cuts a large chunk off buildworld + packaging time.
          # WITH_KERNEL_SYMBOLS ensures kernel.debug is retained in the obj tree
          # so the "stage pkg repo" step can publish it to Pages for crashinfo(8).
          # Passed to buildworld/buildkernel/packages via $EXTRA_MAKE_ARGS.
          echo "EXTRA_MAKE_ARGS=WITHOUT_LIB32=yes WITHOUT_DEBUG_FILES=yes WITH_KERNEL_SYMBOLS=yes" >> $GITHUB_ENV
      - name: bootstrap bmake
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} -n
      - name: build host pkg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -yq --no-install-recommends install \
            build-essential autoconf automake libtool m4 pkg-config \
            libssl-dev libbsd-dev liblzma-dev libarchive-dev \
            libcurl4-openssl-dev zlib1g-dev libbz2-dev
          git clone --depth 1 https://github.com/freebsd/pkg /tmp/pkg
          cd /tmp/pkg
          ./configure --prefix=/usr/local
          make -j"$NPROC"
          sudo make install
          # _pkgbootstrap skips bootstrap iff ${LOCALBASE}/sbin/pkg exists:
          ls -l /usr/local/sbin/pkg || ls -l /usr/local/bin/pkg

      # virglrenderer (stock x11/virglrenderer, VENUS on by default) headers
      # and .so are required by bhyve when BHYVE_VIRGL_SUPPORT=yes.  During the
      # cross-build on Ubuntu the FreeBSD header/libraries are staged into
      # virgl-sysroot by a short FreeBSD VM step (a plain pkg install of the
      # official package) and carried via actions/cache; subsequent runs
      # restore it in seconds.
      - name: restore virglrenderer cache
        id: virgl-cache
        uses: actions/cache@v4
        with:
          path: virgl-sysroot
          key: virglrenderer-fbsd15-1.2.0-venus-2

      - name: stage stock virglrenderer (FreeBSD VM — cold cache only)
        if: steps.virgl-cache.outputs.cache-hit != 'true'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          copyback: true
          run: |
            set -eux
            export ASSUME_ALWAYS_YES=yes
            # The official x11/virglrenderer port is built with the VENUS
            # option on by default, so the stock package already carries
            # Vulkan (venus) support and its render server.  Just install it.
            pkg install -y virglrenderer

            # Stage the header and libraries into the workspace so copyback
            # brings them to the Ubuntu runner and actions/cache persists them.
            mkdir -p "${GITHUB_WORKSPACE}/virgl-sysroot/include/virgl" \
                     "${GITHUB_WORKSPACE}/virgl-sysroot/lib"
            # Copy the whole virgl header set: virglrenderer.h #includes the
            # generated virgl-version.h (and possibly others), so a single-file
            # copy leaves a dangling include.
            cp /usr/local/include/virgl/*.h \
               "${GITHUB_WORKSPACE}/virgl-sysroot/include/virgl/"
            # libvirglrenderer.so plus the libraries it records as NEEDED, so
            # the Ubuntu cross-link resolves them (venus adds libvulkan and
            # libepoll-shim on top of the GL/GBM/DRM deps).
            for l in libvirglrenderer libvulkan libepoll-shim libepoxy \
                     libgbm libdrm; do
              cp -a /usr/local/lib/${l}.so* \
                 "${GITHUB_WORKSPACE}/virgl-sysroot/lib/" 2>/dev/null || true
            done
            ls -la "${GITHUB_WORKSPACE}/virgl-sysroot/lib/"

      - name: install virglrenderer for cross-build
        if: runner.os == 'Linux'
        run: |
          set -eu
          # virgl-sysroot/ is populated either by the VM step above or from cache.
          test -f virgl-sysroot/include/virgl/virglrenderer.h || {
            echo "WARNING: virglrenderer not available; bhyve will build without virgl"
            exit 0
          }
          sudo mkdir -p /usr/local/include /usr/local/lib
          sudo cp -r virgl-sysroot/include/virgl /usr/local/include/
          sudo cp -a virgl-sysroot/lib/*.so* /usr/local/lib/
          # Append to the make args already set by create-environment.
          echo "EXTRA_MAKE_ARGS=${EXTRA_MAKE_ARGS} BHYVE_VIRGL_SUPPORT=yes" >> "$GITHUB_ENV"
          echo "virglrenderer staged; bhyve will build with BHYVE_VIRGL_SUPPORT=yes"

      - name: make kernel-toolchain
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} kernel-toolchain -s -j$NPROC -DWITH_DISK_IMAGE_TOOLS_BOOTSTRAP
      - name: make buildkernel
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=DEFENSO buildkernel -s -j$NPROC $EXTRA_MAKE_ARGS
      - name: make buildworld
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} buildworld -s -j$NPROC $EXTRA_MAKE_ARGS
      - name: make packages
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=DEFENSO PKG_CMD=/usr/local/sbin/pkg REPODIR=$RUNNER_TEMP/repo packages -s -j$NPROC $EXTRA_MAKE_ARGS
      - name: create FreeBSD-kernel-defenso-dbg package
        if: runner.os == 'Linux'
        run: |
          set -eux
          # WITH_KERNEL_SYMBOLS=yes in EXTRA_MAKE_ARGS ensures kernel.debug is
          # produced in the obj tree even when WITHOUT_DEBUG_FILES=yes skips it
          # during installkernel (so make packages never creates the -dbg variant).
          # We create the package manually and re-index the repo here.
          kdbg=$(find "$MAKEOBJDIRPREFIX" -name "kernel.debug" -path "*/DEFENSO/*" | head -1 || true)
          if [ -z "$kdbg" ]; then
            echo "::error::kernel.debug not found; refusing to ship an empty -dbg package"
            exit 1
          fi
          echo "kernel.debug: $kdbg ($(du -sh "$kdbg" | cut -f1))"

          stage=$(mktemp -d)
          install -d "$stage/usr/lib/debug/boot/kernel"
          install -m 0644 "$kdbg" "$stage/usr/lib/debug/boot/kernel/kernel.debug"

          # Module symbols matter more than the kernel's here: a passthrough or
          # virtio-gpu panic lands in vmm.ko, and without vmm.ko.debug those
          # frames stay unresolved however well the kernel itself matches.
          kdir=$(dirname "$kdbg")
          nmod=0
          for m in $(find "$kdir" -name "*.ko.debug" 2>/dev/null); do
            install -m 0644 "$m" "$stage/usr/lib/debug/boot/kernel/$(basename "$m")"
            nmod=$((nmod + 1))
          done
          echo "module debug files: $nmod"

          # Assert the debug info actually belongs to the kernel we ship.
          # objcopy --only-keep-debug preserves the GNU build ID, so the two
          # must be identical; a mismatch means the -dbg package pairs with a
          # different build and kgdb will reject it.
          kpkg=$(find "$RUNNER_TEMP/repo" -name "FreeBSD-kernel-defenso-[0-9]*.pkg" | head -1)
          tar --zstd -xOf "$kpkg" ./boot/kernel/kernel > /tmp/kernel.shipped 2>/dev/null ||
            tar --zstd -xOf "$kpkg" /boot/kernel/kernel > /tmp/kernel.shipped 2>/dev/null || true
          bid_pkg=$(readelf -n /tmp/kernel.shipped 2>/dev/null | awk '/Build ID/{print $NF}')
          bid_dbg=$(readelf -n "$kdbg" 2>/dev/null | awk '/Build ID/{print $NF}')
          echo "build id shipped kernel: ${bid_pkg:-<none>}"
          echo "build id kernel.debug  : ${bid_dbg:-<none>}"
          if [ -z "$bid_dbg" ]; then
            echo "::error::kernel.debug carries no GNU build ID"
            exit 1
          fi
          if [ -n "$bid_pkg" ] && [ "$bid_pkg" != "$bid_dbg" ]; then
            echo "::error::build ID mismatch: the -dbg package does not match"
            echo "::error::the kernel in FreeBSD-kernel-defenso.  kgdb would"
            echo "::error::reject it."
            exit 1
          fi

          # Derive version from a sibling package already in the repo so this
          # package stays in sync with the rest of the pkgbase set.
          pkgver=$(basename "$kpkg" .pkg | sed 's/^FreeBSD-kernel-defenso-//')
          echo "kernel-defenso version: $pkgver"

          # pkg create needs an explicit file list.  Without -p (or a files
          # section in the manifest) it writes a package containing nothing but
          # metadata, which installs cleanly and silently provides no symbols
          # at all -- which is what shipped until now.
          ( cd "$stage" && find . -type f | sed 's/^\.//' ) | sort > /tmp/dbg.plist
          nfiles=$(wc -l < /tmp/dbg.plist)
          echo "staged files: $nfiles"
          if [ "$nfiles" -lt 1 ]; then
            echo "::error::no debug files staged"
            exit 1
          fi

          flatsize=$(find "$stage" -type f -exec stat -c '%s' {} + | awk '{s+=$1}END{print s+0}')
          { echo 'name = "FreeBSD-kernel-defenso-dbg";'
            echo "version = \"$pkgver\";"
            echo 'abi = "FreeBSD:15:amd64";'
            echo "flatsize = $flatsize;"
            echo 'comment = "Debug symbols for the DEFENSO FreeBSD kernel";'
            echo 'desc = "Debug symbols for the DEFENSO FreeBSD kernel and its modules. Install alongside FreeBSD-kernel-defenso, then use crashinfo(8) or kgdb(1) after a panic.";'
            echo 'www = "https://www.freebsd.org";'
            echo 'maintainer = "quentin.thebault@defenso.fr";'
            echo 'prefix = "/";'
            echo 'origin = "sys/FreeBSD-kernel-defenso-dbg";'
          } > /tmp/dbg.ucl

          pkgdir=$(dirname "$kpkg")
          echo "repo dir: $pkgdir"
          /usr/local/sbin/pkg -o ABI="FreeBSD:15:amd64" create \
            -M /tmp/dbg.ucl -p /tmp/dbg.plist -r "$stage" -o "$pkgdir"

          # Prove the result is not empty before publishing it.
          dbgpkg=$(find "$pkgdir" -name "FreeBSD-kernel-defenso-dbg-*.pkg" | head -1)
          got=$(tar --zstd -tf "$dbgpkg" 2>/dev/null | grep -c "kernel.debug" || true)
          echo "kernel.debug present in package: $got"
          if [ "${got:-0}" -lt 1 ]; then
            echo "::error::the -dbg package does not contain kernel.debug"
            exit 1
          fi
          /usr/local/sbin/pkg repo "$pkgdir"

      - name: stage pkg repo for Pages
        if: runner.os == 'Linux'
        run: |
          set -eux
          repo="$RUNNER_TEMP/repo"
          for abidir in "$repo"/*/; do
            target=$(readlink "$abidir/latest" 2>/dev/null || true)
            rm -f "$abidir/latest"
            if [ -n "$target" ] && [ -d "$abidir/$target" ]; then
              mv "$abidir/$target" "$abidir/latest"
            fi
          done
          ls -lR "$repo" | head -n 40
      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/repo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
