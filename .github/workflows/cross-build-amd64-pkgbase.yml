name: Cross-build amd64 pkgbase

on:
  push:
    branches: [ '15.1-build']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target_arch }} ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target_arch: [ amd64 ]
        os: [ ubuntu-24.04 ]
        include:
          # TODO: both Ubuntu and macOS have bmake packages, we should try them instead of bootstrapping our own copy.
          # clang-18 mis-compiles the amd64 kernel/modules: it emits the
          # stack-protector __stack_chk_guard load via the GOT
          # (R_X86_64_REX_GOTPCRELX), which the in-kernel module linker
          # cannot resolve -> unloadable modules (e.g. zfs.ko). clang-19
          # (what FreeBSD 15 ships natively) does not.  No CFLAGS workaround
          # fixes clang-18; the fix is to build with clang-19.
          - os: ubuntu-24.04
            compiler: clang-19
            cross-bindir: /usr/lib/llvm-19/bin
            pkgs: bmake libarchive-dev clang-19 lld-19
          - target_arch: amd64
            target: amd64
    steps:
      - uses: actions/checkout@v4
      - name: install packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --quiet || true
          sudo apt-get -yq --no-install-suggests --no-install-recommends install ${{ matrix.pkgs }}
      - name: create environment
        run: |
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          if [ -n "${{ matrix.cross-bindir }}" ]; then
            echo "EXTRA_BUILD_ARGS=--cross-bindir=${{ matrix.cross-bindir }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ matrix.cross-toolchain }}" ]; then
            echo "EXTRA_BUILD_ARGS=--cross-toolchain=${{ matrix.cross-toolchain }}" >> $GITHUB_ENV
          fi
          mkdir -p ../build
          echo "MAKEOBJDIRPREFIX=${PWD%/*}/build" >> $GITHUB_ENV
          # heh, works on Linux/BSD/macOS ...
          echo "NPROC=`getconf _NPROCESSORS_ONLN 2>/dev/null || getconf NPROCESSORS_ONLN 2>/dev/null || echo 1`" >> $GITHUB_ENV
          # Skip the 32-bit world and debug files: no lib32 / -dbg packages,
          # which also cuts a large chunk off buildworld + packaging time.
          # WITH_KERNEL_SYMBOLS overrides WITHOUT_DEBUG_FILES for the kernel
          # specifically, so FreeBSD-kernel-dbg is produced without re-enabling
          # debug files for all of world.
          # Passed to buildworld/buildkernel/packages via $EXTRA_MAKE_ARGS.
          echo "EXTRA_MAKE_ARGS=WITHOUT_LIB32=yes WITHOUT_DEBUG_FILES=yes WITH_KERNEL_SYMBOLS=yes" >> $GITHUB_ENV
      - name: bootstrap bmake
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} -n
      - name: build host pkg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -yq --no-install-recommends install \
            build-essential autoconf automake libtool m4 pkg-config \
            libssl-dev libbsd-dev liblzma-dev libarchive-dev \
            libcurl4-openssl-dev zlib1g-dev libbz2-dev
          git clone --depth 1 https://github.com/freebsd/pkg /tmp/pkg
          cd /tmp/pkg
          ./configure --prefix=/usr/local
          make -j"$NPROC"
          sudo make install
          # _pkgbootstrap skips bootstrap iff ${LOCALBASE}/sbin/pkg exists:
          ls -l /usr/local/sbin/pkg || ls -l /usr/local/bin/pkg
      - name: make kernel-toolchain
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} kernel-toolchain -s -j$NPROC -DWITH_DISK_IMAGE_TOOLS_BOOTSTRAP
      - name: make buildkernel
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=DEFENSO buildkernel -s -j$NPROC $EXTRA_MAKE_ARGS
      - name: make buildworld
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} buildworld -s -j$NPROC $EXTRA_MAKE_ARGS
      - name: make packages
        run: ./tools/build/make.py --debug $EXTRA_BUILD_ARGS TARGET=${{ matrix.target }} TARGET_ARCH=${{ matrix.target_arch }} KERNCONF=DEFENSO PKG_CMD=/usr/local/sbin/pkg REPODIR=$RUNNER_TEMP/repo packages -s -j$NPROC $EXTRA_MAKE_ARGS
      - name: stage pkg repo for Pages
        if: runner.os == 'Linux'
        run: |
          set -eux
          repo="$RUNNER_TEMP/repo"
          for abidir in "$repo"/*/; do
            target=$(readlink "$abidir/latest" 2>/dev/null || true)
            rm -f "$abidir/latest"
            if [ -n "$target" ] && [ -d "$abidir/$target" ]; then
              mv "$abidir/$target" "$abidir/latest"
            fi
          done
          ls -lR "$repo" | head -n 40
      - name: upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/repo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
